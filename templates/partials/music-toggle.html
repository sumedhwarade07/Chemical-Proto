<div class="music-toggle-wrapper" id="music-container">
  <audio id="lab-audio-player" loop preload="none">
    <source src="/static/media/music.mp3" type="audio/mpeg">
  </audio>
  <button class="music-btn" id="music-toggle-btn" aria-label="Toggle ambient lab study music" title="Ambient Study Sound">
    <div class="music-indicator" aria-hidden="true">
      <span class="music-bar"></span>
      <span class="music-bar"></span>
      <span class="music-bar"></span>
    </div>
    <span id="music-btn-text">Study Audio</span>
  </button>
</div>
